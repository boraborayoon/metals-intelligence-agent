name: Metals News Agent

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending or writing data'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: metals-intelligence-data-writer
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news intelligence agent
        run: npm run agent

      - name: Commit updated intelligence data
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          git add data/sent-items.json data/codex-analysis-queue.json public/data/latest-news.json public/data/status.json public/data/market-summary.json public/data/codex-analysis-queue.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "metals-intelligence-bot"
          git config user.email "metals-intelligence-bot@users.noreply.github.com"
          git commit -m "chore: update metals intelligence data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: '3. Market Digest (07:30 / 12:00 / 17:30 KST)'
run-name: "3. Market Digest · ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}"

on:
  schedule:
    - cron: '30 7,17 * * *'
      timezone: 'Asia/Seoul'
    - cron: '0 12 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render without sending'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metals-intelligence-data-writer
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENABLE_TELEGRAM: 'true'
      # Kakao delivery is intentionally paused. Uncomment the credentials and
      # change ENABLE_KAKAO to 'true' if Kakao notifications are needed again.
      # KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      # KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      # KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      # KAKAO_LINK_URL: https://boraborayoon.github.io/metals-intelligence-agent/
      ENABLE_KAKAO: 'false'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send daily digest
        run: npm run digest
